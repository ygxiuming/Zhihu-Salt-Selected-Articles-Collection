<header class="site-header">
  <div class="container header-inner{{ if ne .Kind "page" }} has-nav{{ end }}">
    <a class="brand" href="{{ site.BaseURL | relLangURL }}" aria-label="返回首页">
      <svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="brand-lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#e2b071"/><stop offset="1" stop-color="#a3541f"/>
          </linearGradient>
        </defs>
        <path d="M32 6 46 24 32 42 18 24Z" fill="url(#brand-lg)"/>
        <path d="M32 12 41 24 32 36 23 24Z" fill="#fff" opacity=".16"/>
        <path d="M21 44 29 54 21 62 13 54Z" fill="url(#brand-lg)" opacity=".9"/>
        <path d="M43 44 51 54 43 62 35 54Z" fill="url(#brand-lg)" opacity=".72"/>
      </svg>
      <span>盐选收藏</span>
    </a>
    {{ if eq .Kind "page" }}
      <nav class="crumb" aria-label="面包屑">
        {{ with .Parent }}<a href="{{ .RelPermalink }}">{{ .Title }}</a><span class="crumb-sep">/</span>{{ end }}
        <span class="crumb-here">{{ .Title }}</span>
      </nav>
    {{ else }}
      <nav class="nav-links" aria-label="主导航">
        {{ range sort site.Sections "Title" }}<a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}
        <a class="nav-star" href="{{ site.Params.github }}" target="_blank" rel="noopener" title="去 GitHub 点个 Star">★ Star</a>
      </nav>
    {{ end }}
    <div class="header-actions">
      <button id="theme-toggle" class="icon-btn" title="切换深浅主题" aria-label="切换深浅主题">◐</button>
      <button id="nav-toggle" class="icon-btn" title="菜单" aria-label="打开菜单">☰</button>
    </div>
  </div>
  {{ if eq .Kind "page" }}<div class="progress" id="read-progress"></div>{{ end }}
</header>
<div class="drawer-backdrop" id="drawer-backdrop"></div>
<aside class="drawer" id="drawer" aria-label="移动端导航">
  <div class="drawer-label">来源</div>
  {{ range sort site.Sections "Title" }}<a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}
  <div class="drawer-label">更多</div>
  <a href="{{ site.BaseURL | relLangURL }}#search">全文搜索</a>
  <a href="{{ site.Params.github }}" target="_blank" rel="noopener">GitHub 仓库</a>
</aside>
