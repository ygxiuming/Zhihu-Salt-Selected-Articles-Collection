{{ define "main" }}
<section class="list-page">
  <h1 class="sec-title">{{ .Title }}<span class="sec-hint">共 {{ len .Pages }} 篇 · 跨源去重后</span></h1>
  <div id="browser"
       data-source="{{ .Title }}"
       data-index="{{ "data/articles_index.json" | relURL }}"
       data-base="{{ (urls.Parse site.BaseURL).Path }}"
       data-repo-url="{{ site.Params.github }}">
    {{/* 无 JS 兜底：静态渲染前 40 篇；JS 可用时替换为完整筛选浏览 */}}
    <ul class="browse-list">
      {{ range first 40 .Pages.ByTitle }}
        <li><a href="{{ .RelPermalink }}"><span class="bl-title">{{ .Title }}</span></a></li>
      {{ end }}
    </ul>
  </div>
  <noscript><div class="read-error">筛选与分页需启用 JavaScript；当前显示前 40 篇（按标题排序），
    完整目录见仓库内 <a class="btn" href="{{ site.Params.github }}/tree/main/{{ .Name }}"
    target="_blank" rel="noopener">{{ .Name }}/目录-*.md</a>。</div></noscript>
</section>
{{ end }}
