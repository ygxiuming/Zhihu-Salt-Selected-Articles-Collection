name: 同步源站

on:
  schedule:
    - cron: "0 2 * * *"   # 每日 02:00 UTC（北京 10:00）
  workflow_dispatch:
    inputs:
      sources:
        description: "要同步的源（逗号分隔：yanshen,zhbyg,yanxuanwk,yuque 或 all）"
        default: "all"
      limit:
        description: "每个源本次最多抓取篇数（0=不限，首跑追平约 7000 篇）"
        default: "800"

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 安装依赖
        run: pip install -r scripts/requirements.txt

      - name: 增量同步
        env:
          SYNC_RATE: "1.0"
          SYNC_LIMIT: ${{ inputs.limit || '800' }}
        run: |
          python scripts/sync/run_sync.py \
            --sources "${{ inputs.sources || 'all' }}" \
            --limit "$SYNC_LIMIT"

      - name: 校验
        run: python scripts/validate.py

      - name: 提交并推送
        id: commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            N=$(git status --porcelain | grep -c '^??' || true)
            git add -A
            git commit -m "sync: 增量同步（新增约 ${N:-0} 篇）"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无新增内容"
          fi

      # 公共仓库定时任务 60 天无活动会被 GitHub 自动禁用：
      # 临近 60 天无提交时制造空提交保活（内联实现，避免依赖第三方 action）
      - name: 保活（防止定时任务被禁用）
        if: always()
        run: |
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .commit.committer.date)
          DAYS=$(( ($(date +%s) - $(date -d "$LAST" +%s)) / 86400 ))
          echo "距上次提交 $DAYS 天"
          if [ "$DAYS" -ge 55 ]; then
            git config user.name "ygxiuming"
            git config user.email "ygxiuming@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive（防止定时任务被自动禁用）"
            git push
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 触发站点部署
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
