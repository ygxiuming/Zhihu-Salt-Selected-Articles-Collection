name: 同步源站

on:
  schedule:
    - cron: "0 */2 * * *"   # 每 2 小时（增量扫描已优化为分钟级，见 EARLY_EXIT_PAGES）
  workflow_dispatch:
    inputs:
      sources:
        description: "要同步的源（逗号分隔：yanshen,zhbyg,yanxuanwk,yuque 或 all）"
        default: "all"
      limit:
        description: "每个源本次最多抓取篇数（0=不限，首跑追平约 7000 篇）"
        default: "800"

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 安装依赖
        run: pip install -r scripts/requirements.txt

      - name: 增量同步
        id: sync
        env:
          SYNC_RATE: "1.0"
          SYNC_LIMIT: ${{ inputs.limit || '800' }}
          YUQUE_COOKIE: ${{ secrets.YUQUE_COOKIE }}
        run: |
          python scripts/sync/run_sync.py \
            --sources "${{ inputs.sources || 'all' }}" \
            --limit "$SYNC_LIMIT"

      - name: 校验
        run: python scripts/validate.py

      # 长时间追平若在后续步骤失败，已抓取的文章随 runner 销毁即丢失；
      # 失败时把文章目录打包留存，可从 Artifacts 手动恢复
      - name: 失败时保留已抓取文章
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-workspace-${{ github.run_id }}
          retention-days: 7
          path: |
            我不是盐神
            知乎搬运工
            盐选文库
            语雀盐选库
            目录.md
            data

      - name: 提交并推送
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            N=$(git status --porcelain | grep -c '^??' || true)
            git add -A
            git commit -m "sync: 增量同步（新增约 ${N:-0} 篇）"
            # 长时间同步期间 main 可能已有新提交（并发推送）：
            # rebase 到最新 main，冲突时优先取本侧生成文件（索引/统计）
            git fetch origin main
            git rebase -X ours origin/main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无新增内容"
          fi

      # 公共仓库定时任务 60 天无活动会被 GitHub 自动禁用：
      # 临近 60 天无提交时制造空提交保活（内联实现，避免依赖第三方 action）
      - name: 保活（防止定时任务被禁用）
        if: always()
        run: |
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .commit.committer.date)
          DAYS=$(( ($(date +%s) - $(date -d "$LAST" +%s)) / 86400 ))
          echo "距上次提交 $DAYS 天"
          if [ "$DAYS" -ge 55 ]; then
            git config user.name "ygxiuming"
            git config user.email "ygxiuming@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive（防止定时任务被自动禁用）"
            git push
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 触发站点部署
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
