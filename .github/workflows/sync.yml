name: 同步源站

# 定时同步已关闭（改为手动）：Actions 页面 → 同步源站 → Run workflow
# 可选 sources（yanshen,zhbyg,yanxuanwk,yuque 或 all）与 limit（每源上限）
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "要同步的源（逗号分隔：yanshen,zhbyg,yanxuanwk,yuque 或 all）"
        default: "all"
      limit:
        description: "每个源本次最多抓取篇数（0=不限，首跑追平约 7000 篇）"
        default: "800"

# contents: write 供「提交并推送」步骤使用；
# 不要加 actions: write——GITHUB_TOKEN 无法 dispatch 其他 workflow（平台限制）
permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 安装依赖
        run: pip install -r scripts/requirements.txt

      - name: 增量同步
        id: sync
        env:
          SYNC_RATE: "1.0"
          SYNC_LIMIT: ${{ inputs.limit || '800' }}
          YUQUE_COOKIE: ${{ secrets.YUQUE_COOKIE }}
        run: |
          python scripts/sync/run_sync.py \
            --sources "${{ inputs.sources || 'all' }}" \
            --limit "$SYNC_LIMIT"

      - name: 校验
        run: python scripts/validate.py

      # 长时间追平若在后续步骤失败，已抓取的文章随 runner 销毁即丢失；
      # 失败时把文章目录打包留存，可从 Artifacts 手动恢复
      - name: 失败时保留已抓取文章
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-workspace-${{ github.run_id }}
          retention-days: 7
          path: |
            我不是盐神
            知乎搬运工
            盐选文库
            语雀盐选库
            目录.md
            data

      - name: 提交并推送
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            N=$(git status --porcelain | grep -c '^??' || true)
            git add -A
            git commit -m "sync: 增量同步（新增约 ${N:-0} 篇）"
            # 长时间同步期间 main 可能已有新提交（并发推送）：
            # rebase 到最新 main，冲突时优先取本侧生成文件（索引/统计）
            git fetch origin main
            git rebase -X ours origin/main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无新增内容"
          fi

      # 站点部署不在这里触发：GITHUB_TOKEN 被 GitHub 平台禁止创建
      # workflow dispatch（HTTP 403 "Resource not accessible by integration"，
      # actions: write 权限也绕不过）。改为下方 deploy-site 任务复用
      # deploy.yml（reusable workflow，不受该限制），检出最新 main 构建。

  deploy-site:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    # reusable workflow 的调用方必须显式授予 Pages 部署权限
    permissions:
      contents: read
      pages: write
      id-token: write

