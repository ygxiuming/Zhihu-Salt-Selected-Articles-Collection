name: 构建部署站点

# 触发方式：手动 / push（源文件变更）/ 被 sync.yml 复用（同步有新增后
# 直接调用，GITHUB_TOKEN 无法 dispatch 其他 workflow，reusable 调用不受限）
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "我不是盐神/**"
      - "知乎搬运工/**"
      - "盐选文库/**"
      - "语雀盐选库/**"
      - "layouts/**"
      - "static/**"
      - "data/articles_index.json"
      - "data/stats.json"
      - "hugo.toml"
      - "scripts/verify_site.py"
      - "scripts/repair_site.py"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 显式检出 main 顶端：workflow_call/workflow_run 携带的 SHA 是
      # 同步开始时的 commit，会漏掉同步期间新推送的文章
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.154.5"
          extended: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 构建 Hugo 站点（校验产物，坏页跨构建交叉修复）
        run: |
          hugo --minify --gc
          for i in 2 3; do
            if python3 scripts/verify_site.py public; then exit 0; fi
            echo "::warning::存在坏页，用第 $i 次构建交叉修复…"
            hugo --minify --gc -d "public-$i"
            python3 scripts/repair_site.py public "public-$i" || true
          done
          python3 scripts/verify_site.py public

      - name: 生成 Pagefind 全文搜索索引（内置中日韩分词）
        run: npx -y pagefind@1.5.2 --site public

      - name: 检查发布体积（Pages 上限 1GB）
        run: du -sh public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
